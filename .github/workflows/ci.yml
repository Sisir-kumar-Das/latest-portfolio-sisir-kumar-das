name: CI

# Runs on every push and pull request targeting main. This is the
# "continuous integration" half of the pipeline: it proves the app still
# builds cleanly. Actual deployment ("continuous delivery") is handled by
# Vercel (client) and Render (server), which both auto-deploy on push to
# main via their native GitHub integrations — see DEPLOYMENT.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [server, client]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.workspace }}
        run: npm run build --workspace ${{ matrix.workspace }}

      - name: Lint ${{ matrix.workspace }}
        run: npm run lint --workspace ${{ matrix.workspace }}
